name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: ByeDPI unit tests
        working-directory: core
        run: go test ./byedpi/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Build libbox AAR
        run: ./scripts/build-core.sh
      - name: Assemble debug and test
        run: ./gradlew assembleDebug :engine:test --no-daemon
